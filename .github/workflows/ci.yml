name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://proposal:proposal@localhost:5432/proposalbuilder?schema=public
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proposal
          POSTGRES_PASSWORD: proposal
          POSTGRES_DB: proposalbuilder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proposal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
