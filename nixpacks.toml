# LibreOffice headless, used by src/lib/render/soffice.ts for .docx->PDF,
# .docx->HTML (preview bridge), and .html->.docx (legacy-content bridge) —
# see src/lib/render/docx-to-pdf.ts and compose-proposal.ts. Puppeteer (the
# previous PDF engine) and its Chromium runtime libs were removed once the
# migration to this pipeline was confirmed complete; libreoffice-writer pulls
# in libreoffice-core as a dependency, so it alone is enough for the
# --headless --convert-to invocations this app makes.
#
# NOT YET VALIDATED against an actual Railway build — soffice's resolved path
# there may need LIBREOFFICE_EXECUTABLE_PATH set explicitly (see .env.example
# and src/lib/render/soffice.ts's DEFAULT_CANDIDATES). Confirm a real
# docx->pdf conversion succeeds on a fresh Railway deploy before relying on
# this in production.
[phases.setup]
aptPkgs = [
  "ca-certificates",
  "fonts-liberation",
  "libreoffice-writer",
]
