# Runtime shared libraries Puppeteer's bundled Chromium needs to launch on a
# minimal Debian/Ubuntu container (Railway, Render, Nixpacks-based builds).
# This does NOT install a separate browser — `npm install` still downloads
# Puppeteer's own Chromium; these packages just let that binary execute.
[phases.setup]
aptPkgs = [
  "ca-certificates",
  "fonts-liberation",
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcups2",
  "libdbus-1-3",
  "libdrm2",
  "libgbm1",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libx11-xcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libxshmfence1",
  "xdg-utils",
]
